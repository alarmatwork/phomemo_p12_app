<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P12 Label Studio</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@400;700&family=Inter:ital,wght@0,400;0,700;1,400;1,700&family=Pacifico&family=Permanent+Marker&family=Roboto+Slab:wght@400;700&family=Space+Grotesk:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=block">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e2e0d9;
  --accent: #1f6f5c; --accent-ink: #ffffff; --warn: #b4441f; --chip: #eeede8; --tape: #fbfaf6;
  --radius: 12px; font-synthesis: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --panel: #201f1c; --ink: #ecebe6; --muted: #a09e96; --line: #34332e;
    --accent: #4cb59a; --accent-ink: #0d1f1a; --warn: #f08a63; --chip: #2b2a26; --tape: #fbfaf6;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --panel: #201f1c; --ink: #ecebe6; --muted: #a09e96; --line: #34332e;
  --accent: #4cb59a; --accent-ink: #0d1f1a; --warn: #f08a63; --chip: #2b2a26; --tape: #fbfaf6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0 auto 0 0; letter-spacing: -0.01em; }
#status { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12.5px; padding: 3px 9px; border-radius: 99px; background: var(--chip); }
.chip.ok { background: var(--accent); color: var(--accent-ink); }
.chip.warn { background: var(--warn); color: #fff; }
.chip.muted { color: var(--muted); }
button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; padding: 20px; max-width: 1280px; margin: 0 auto; }
.stage { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
.tape-wrap { overflow-x: auto; padding: 28px 8px; background: repeating-linear-gradient(45deg, transparent 0 10px, color-mix(in srgb, var(--line) 45%, transparent) 10px 11px); border-radius: 10px; text-align: center; }
#preview { height: auto; max-width: 100%; image-rendering: pixelated; background: var(--tape); border-radius: 3px; box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.12); vertical-align: middle; }
#dims { color: var(--muted); font-size: 13px; margin-top: 10px; text-align: center; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions .spacer { flex: 1; }
#templates { display: flex; flex-wrap: wrap; gap: 6px; }
.tpl { font-size: 13.5px; padding: 6px 11px; border-radius: 99px; }
#frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-top: 12px; }
.swatch { padding: 4px; background: #fff; }
.swatch canvas { width: 100%; display: block; image-rendering: pixelated; }
.swatch.on, .icon-pick.on, .block.on { outline: 2px solid var(--accent); outline-offset: 1px; }
aside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); margin-bottom: 10px; flex: 1; min-width: 0; }
.field:has(input[type=checkbox]) { flex-direction: row-reverse; justify-content: flex-end; align-items: center; gap: 8px; color: var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
input[type=range] { padding: 0; accent-color: var(--accent); }
textarea { resize: vertical; }
#blocks { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.block { display: flex; gap: 4px; align-items: stretch; border-radius: 9px; }
.block-main { flex: 1; text-align: left; display: flex; gap: 8px; min-width: 0; align-items: baseline; }
.block-main span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 34px; padding: 0; }
#add { display: flex; flex-wrap: wrap; gap: 6px; }
#add button { font-size: 13px; padding: 5px 9px; }
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; margin-bottom: 12px; }
.icon-pick { padding: 5px; background: #fff; line-height: 0; }
.hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
#no-serial { border-color: var(--warn); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; transition: .25s; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; max-width: calc(100vw - 32px); pointer-events: none; z-index: 10; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 860px) {
  main { grid-template-columns: 1fr; padding: 16px; }
  header { padding: 12px 16px; }

}
</style>
</head>
<body>
<header>
  <h1>P12 Label Studio</h1>
  <div id="status"></div>
  <button id="connect" type="button">Connect printer</button>
  <button id="print" class="primary" type="button">Print</button>
</header>

<main>
  <section class="stage">
    <div class="panel" id="no-serial" hidden>
      <b>This browser can't reach the printer directly.</b>
      <p class="hint">Printing over Bluetooth needs Web Serial, which desktop Chrome and Edge have. You can still design here and use “Download .bin” or “Save PNG” with the Python CLI.</p>
    </div>
    <div class="panel">
      <div class="tape-wrap"><canvas id="preview" width="200" height="96"></canvas></div>
      <div id="dims"></div>
    </div>
    <div class="panel">
      <h2>Templates</h2>
      <div id="templates"></div>
    </div>
    <div class="panel">
      <h2>Label &amp; frame</h2>
      <div class="row" id="label-panel"></div>
      <div id="frames"></div>
    </div>
    <div class="panel actions">
      <button id="test" type="button" class="ghost">Orientation test</button>
      <span class="spacer"></span>
      <button id="save-png" type="button" class="ghost">Save PNG</button>
      <button id="save-bin" type="button" class="ghost">Download .bin</button>
      <button id="save-json" type="button" class="ghost">Save design</button>
      <label class="ghost" style="cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:7px 12px">Open design<input id="load-json" type="file" accept=".json" hidden></label>
    </div>
  </section>

  <aside>
    <div class="panel">
      <h2>Content (left → right)</h2>
      <div id="blocks"></div>
      <div id="add"></div>
    </div>
    <div class="panel">
      <h2>Edit block</h2>
      <div id="editor"></div>
    </div>
    <div class="panel">
      <h2>Print</h2>
      <div id="print-settings"></div>
    </div>
  </aside>
</main>
<div id="toast" role="status"></div>

<script src="p12.js"></script>
<script src="graphics.js"></script>
<script src="app.js"></script>
</body>
</html>
