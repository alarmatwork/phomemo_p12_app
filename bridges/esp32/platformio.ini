; Build: pio run   Flash: pio run -t upload   Logs: pio device monitor
[platformio]
src_dir = p12_bridge

[env:atom-lite]
platform = espressif32@6.9.0
board = m5stack-atom
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps = tzapu/WiFiManager@2.0.17

; Any other original-ESP32 board (DevKitC, WROOM-32, FireBeetle ESP32): pio run -e esp32dev
[env:esp32dev]
extends = env:atom-lite
board = esp32dev
upload_speed = 460800
